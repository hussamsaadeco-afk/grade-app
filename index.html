<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>نظام إدارة المدرسة المتقدم</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--p:#1e40af;--d:#1e3a8a;--bg:#f1f5f9;--s:#10b981;--e:#ef4444;--w:#f59e0b;--g:#6b7280;}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,sans-serif;}
body{background:var(--bg);color:#334155;padding-bottom:70px;}
#login,#st-portal{position:fixed;inset:0;background:var(--d);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;}
.box{background:#fff;padding:25px;border-radius:16px;width:100%;max-width:350px;text-align:center;}
.box h2{margin-bottom:20px;color:var(--p);}
input,select,button{width:100%;padding:12px;margin-bottom:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;font-family:inherit;}
button{cursor:pointer;font-weight:bold;border:none;}
.b1{background:var(--p);color:#fff;}.b2{background:var(--s);color:#fff;}.b3{background:var(--e);color:#fff;}.b4{background:var(--w);color:#fff;}
.b1.o{background:transparent;color:var(--p);border:2px solid var(--p);}
header{background:var(--p);color:#fff;padding:15px 20px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:100;}
header h1{font-size:16px;}
main{padding:15px;max-width:900px;margin:0 auto;}
.tab{display:none;}.tab.active{display:block;}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:15px;box-shadow:0 2px 5px rgba(0,0,0,.05);}
.card h2{font-size:15px;color:var(--d);margin-bottom:15px;border-bottom:2px solid #f1f5f9;padding-bottom:10px;}
.row{display:flex;gap:10px;}.row>*{flex:1;}
.li{background:#fff;border:1px solid #e2e8f0;padding:12px;margin-bottom:8px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;}
.li b{display:block;font-size:15px;color:var(--d);}.li small{color:#64748b;font-size:12px;}
.ib{width:auto;padding:6px 10px;margin:0;background:#fee2e2;color:var(--e);border-radius:6px;border:none;}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #e2e8f0;z-index:100;overflow-x:auto;}
.nb{background:none;display:flex;flex-direction:column;align-items:center;color:#94a3b8;font-size:18px;width:auto;padding:5px 8px;margin:0;white-space:nowrap;}
.nb span{font-size:10px;margin-top:4px;}.nb.active{color:var(--p);background:#eff6ff;border-radius:8px;}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px;background:#fff;display:block;overflow-x:auto;}
th,td{border:1px solid #e2e8f0;padding:8px;text-align:center;white-space:nowrap;}th{background:#f8fafc;color:var(--d);}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--d);color:#fff;padding:12px 24px;border-radius:25px;font-size:14px;opacity:0;transition:all .3s;z-index:10000;text-align:center;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}.toast.e{background:var(--e);}.toast.s{background:var(--s);}
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <h2>🔐 دخول الإدارة</h2>
    <input type="password" id="lp" placeholder="كلمة المرور (123456)">
    <button class="b1" onclick="adminLogin()">دخول</button>
    <button class="b1 o" onclick="showSt()">🎓 دخول الطالب</button>
    <button style="background:#cbd5e1; color:#000; margin-top:10px; font-size:12px;" onclick="adminLogin(true)">(دخول للتجربة)</button>
  </div>
</div>

<div id="st-portal" style="display:none;">
  <div class="box">
    <h2>🎓 بوابة الطالب</h2>
    <input type="text" id="sc" placeholder="أدخل كود الطالب">
    <button class="b1" onclick="stLogin()">عرض درجاتي</button>
    <button class="b1 o" onclick="hideSt()">🔙 رجوع</button>
  </div>
</div>

<div id="st-view" style="display:none;padding:20px;">
  <div class="card">
    <h2 id="st-name" style="text-align:center;">مرحباً</h2>
    <div id="st-grades"></div>
    <button class="b3" onclick="document.getElementById('st-view').style.display='none';showSt();" style="margin-top:15px;">خروج</button>
  </div>
</div>

<div id="admin" style="display:none;">
  <header><h1>🏫 إدارة المدرسة</h1><button class="ib" style="background:rgba(255,255,255,.2);color:#fff;" onclick="logout()">خروج</button></header>
  <nav class="nav">
    <button class="nb active" data-tab="students">👨‍🎓<span>الطلاب</span></button>
    <button class="nb" data-tab="grades">📝<span>الدرجات</span></button>
    <button class="nb" data-tab="att">📅<span>الغياب</span></button>
    <button class="nb" data-tab="act">🏅<span>النشاط</span></button>
    <button class="nb" data-tab="rep">📄<span>الكشوف</span></button>
    <button class="nb" data-tab="set">⚙️<span>الإدارة</span></button>
  </nav>
  
  <main>
    <section id="students" class="tab active"><div class="card"><h2>👨‍🎓 الطلاب</h2><input id="search" placeholder="🔍 بحث..." oninput="renderSt()"><div id="st-list"></div></div></section>
    
    <section id="grades" class="tab"><div class="card"><h2>📝 إدخال الدرجات</h2>
      <p style="font-size:12px; color:var(--e); margin-bottom:10px;">* ملاحظة: أدخل درجة الشفوي الأساسية، وسيقوم النظام بخصم درجات الغياب تلقائياً.</p>
      <div class="row"><select id="gs" onchange="renderGt()"><option value="">-- الشعبة --</option></select><select id="gsub" onchange="renderGt()"><option value="">-- المادة --</option></select></div>
      <div id="gt" style="overflow-x:auto;margin-top:15px;"></div><button class="b2" id="sg" style="display:none;margin-top:15px;" onclick="saveG()">💾 حفظ الدرجات</button>
    </div></section>
    
    <section id="att" class="tab"><div class="card"><h2>📅 الغياب (خصم 5 درجات)</h2><input type="date" id="ad" onchange="renderAtt()"><select id="as" onchange="renderAtt()"><option value="">-- الشعبة --</option></select><div id="al" style="margin-top:15px;"></div></div></section>
    
    <section id="act" class="tab"><div class="card"><h2>🏅 النشاط (إضافة 10 درجات)</h2><select id="acs" onchange="renderAct()"><option value="">-- الشعبة --</option></select><div id="acl" style="margin-top:15px;"></div><button class="b2" id="sa" style="display:none;margin-top:15px;" onclick="saveAct()">💾 حفظ النشاط</button></div></section>
    
    <section id="rep" class="tab">
      <div class="card">
        <h2>📄 الكشوف</h2>
        <select id="rs" onchange="genRep('rep-box')"></select>
        <div class="row" style="margin-top:10px;">
          <button class="b1" onclick="window.print()">🖨️ طباعة الكشف</button>
          <button class="b4" onclick="printAttAct()">🖨️ طباعة غياب ونشاط</button>
        </div>
        <div id="rep-box" style="margin-top:15px;"></div>
      </div>
    </section>
    
    <section id="set" class="tab">
      <div class="card"><h2>📥 استيراد إكسل</h2>
        <div class="row"><select id="is" style="margin-bottom:10px;"><option value="">-- الشعبة --</option></select><button class="b4" onclick="ref()" style="width:60px; margin:0 0 10px 0;">تحديث</button></div>
        <input type="file" id="ef" accept=".xlsx,.xls,.csv" style="border:1px dashed #cbd5e1;padding:10px;"><button class="b1" onclick="impEx()">استيراد</button>
      </div>
      
      <div class="card"><h2>🏫 الشعب</h2>
        <div style="display:flex; flex-wrap:wrap; gap:5px; margin-bottom:10px;">
          <button class="b2" onclick="quickAdd('أ')" style="width:auto; padding:8px 15px; margin:0;">أ</button>
          <button class="b2" onclick="quickAdd('ب')" style="width:auto; padding:8px 15px; margin:0;">ب</button>
          <button class="b2" onclick="quickAdd('ج')" style="width:auto; padding:8px 15px; margin:0;">ج</button>
          <button class="b2" onclick="quickAdd('د')" style="width:auto; padding:8px 15px; margin:0;">د</button>
          <button class="b2" onclick="quickAdd('هـ')" style="width:auto; padding:8px 15px; margin:0;">هـ</button>
        </div>
        <div class="row"><input id="sn" placeholder="أو اكتب اسم شعبة مخصصة"><button class="b2" onclick="addS()" style="width:80px;margin:0;">إضافة</button></div>
        <div id="sl" style="margin-top:10px;"></div>
      </div>
      
      <div class="card"><h2>📚 المواد</h2>
        <div class="row"><input id="sub" placeholder="اسم المادة"><button class="b2" onclick="addSub()" style="width:80px;margin:0;">إضافة</button></div>
        <div id="subl" style="margin-top:10px;"></div>
      </div>
      
      <div class="card"><h2>🔐 كلمة المرور</h2><input type="password" id="np" placeholder="الجديدة"><button class="b4" onclick="chPass()">تحديث</button></div>
      <div class="card"><h2>⚠️ الخطر</h2><button class="b3" onclick="clearAll()">🗑️ حذف كل بيانات المدرسة</button></div>
    </section>
  </main>
</div>
<div id="toast" class="toast"></div>

<script>
let defaultSubs = [
  {id:1,name:'اسلامية',max:100,pass:50},{id:2,name:'عربي',max:100,pass:50},{id:3,name:'انكليزي',max:100,pass:50},
  {id:4,name:'رياضيات',max:100,pass:50},{id:5,name:'احياء',max:100,pass:50},{id:6,name:'فيزياء',max:100,pass:50},
  {id:7,name:'كيمياء',max:100,pass:50},{id:8,name:'اجتماعيات',max:100,pass:50},{id:9,name:'اخلاقيه',max:100,pass:50}
];

let DB=JSON.parse(localStorage.getItem('schoolDB')||`{"students":[],"sections":[],"subjects":[],"grades":[],"attendance":{},"activity":{},"adminPass":"123456"}`);
if(!DB.subjects || DB.subjects.length===0) { DB.subjects = defaultSubs; localStorage.setItem('schoolDB',JSON.stringify(DB)); }

function sv(){localStorage.setItem('schoolDB',JSON.stringify(DB));}
function tst(m,t='s'){let e=document.getElementById('toast');e.textContent=m;e.className='toast show '+t;setTimeout(()=>e.className='toast '+t,2500);}
function nid(a){return a.length?Math.max(...a.map(x=>x.id))+1:1;}

function adminLogin(bypass=false){
  let p=document.getElementById('lp').value;
  if(bypass || p===DB.adminPass){ document.getElementById('login').style.display='none'; document.getElementById('admin').style.display='block'; init(); }
  else tst('كلمة المرور خاطئة','e');
}
function logout(){document.getElementById('admin').style.display='none';document.getElementById('login').style.display='flex';document.getElementById('lp').value='';}
function showSt(){document.getElementById('login').style.display='none';document.getElementById('st-portal').style.display='flex';}
function hideSt(){document.getElementById('st-portal').style.display='none';document.getElementById('login').style.display='flex';}
function stLogin(){let c=document.getElementById('sc').value.trim();let s=DB.students.find(x=>x.code===c);if(s){document.getElementById('st-portal').style.display='none';document.getElementById('st-view').style.display='block';document.getElementById('st-name').innerText='مرحباً، '+s.name;genRep('st-grades',s.id);}else tst('كود خطأ','e');}
function chPass(){let p=document.getElementById('np').value;if(p.length>3){DB.adminPass=p;sv();tst('تم التحديث');document.getElementById('np').value='';}else tst('قصيرة','e');}

document.querySelectorAll('.nb').forEach(b=>{b.addEventListener('click',()=>{document.querySelectorAll('.nb').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active');if(b.dataset.tab==='att')document.getElementById('ad').valueAsDate=new Date();ref();});});

function quickAdd(n){ if(!DB.sections.includes(n)){ DB.sections.push(n); sv(); ref(); tst('تمت إضافة شعبة '+n); } else { tst('موجودة بالفعل', 'e'); } }
function impEx(){
  let f=document.getElementById('ef').files[0],sec=document.getElementById('is').value;
  if(!sec)return tst('اختر الشعبة','e');if(!f)return tst('اختر الملف','e');
  let r=new FileReader();
  r.onload=e=>{
    try{
      let w=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      let rows=XLSX.utils.sheet_to_json(w.Sheets[w.SheetNames[0]],{header:1});
      let ci=0;for(let i=0;i<rows[0].length;i++){if(String(rows[0][i]).includes('اسم')||String(rows[0][i]).toLowerCase().includes('name')){ci=i;break;}}
      let imp=0,skp=0;
      for(let i=1;i<rows.length;i++){
        let rw=rows[i];
        if(rw&&rw[ci]){ let n=String(rw[ci]).trim(); if(n){if(DB.students.some(x=>x.name===n)){skp++;continue;} DB.students.push({id:nid(DB.students),name:n,section:sec,code:sec+'-'+(1000+DB.students.length+1)}); imp++;} }
      }
      sv();init();document.getElementById('ef').value='';tst(`استيراد ${imp} (مكرر: ${skp})`);
    }catch(err){tst('خطأ في الملف','e');}
  };r.readAsArrayBuffer(f);
}
function addS(){let n=document.getElementById('sn').value.trim();if(n){if(!DB.sections.includes(n)){DB.sections.push(n);sv();ref();document.getElementById('sn').value='';tst('تمت الإضافة');}else tst('موجودة','e');}}
function delS(n){if(confirm('حذف الشعبة؟')){DB.sections=DB.sections.filter(x=>x!==n);DB.students=DB.students.filter(x=>x.section!==n);sv();init();}}
function addSub(){let n=document.getElementById('sub').value.trim();if(n){DB.subjects.push({id:nid(DB.subjects),name:n,max:100,pass:50});sv();ref();document.getElementById('sub').value='';tst('تمت الإضافة');}}
function delSub(id){if(confirm('حذف المادة؟')){DB.subjects=DB.subjects.filter(x=>x.id!==id);sv();init();}}
function delSt(id){if(confirm('حذف الطالب؟')){DB.students=DB.students.filter(x=>x.id!==id);sv();renderSt();}}
function clearAll(){if(confirm('تأكيد مسح الكل؟')){if(prompt('اكتب "حذف":')==='حذف'){DB={"students":[],"sections":[],"subjects":defaultSubs,"grades":[],"attendance":{},"activity":{},"adminPass":"123456"};sv();init();tst('تم المسح');}}}

function renderSt(){
  let q=document.getElementById('search').value;
  let f=DB.students.filter(x=>x.name.includes(q)||x.code.includes(q));
  let h=document.getElementById('st-list');
  if(!f.length)return h.innerHTML='<p style="text-align:center;padding:20px;">لا يوجد</p>';
  h.innerHTML=f.map(x=>`<div class="li"><div><b>${x.name}</b><small>الشعبة: ${x.section} | الكود: ${x.code}</small></div><button class="ib" onclick="delSt(${x.id})">🗑️</button></div>`).join('');
}

function init(){ ref(); renderSt(); }
function ref(){
  let so=DB.sections.map(x=>`<option value="${x}">${x}</option>`).join(''),suo=DB.subjects.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');
  document.getElementById('is').innerHTML='<option value="">-- الشعبة --</option>'+so;
  document.getElementById('gs').innerHTML='<option value="">-- الشعبة --</option>'+so;
  document.getElementById('as').innerHTML='<option value="">-- الشعبة --</option>'+so;
  document.getElementById('acs').innerHTML='<option value="">-- الشعبة --</option>'+so;
  document.getElementById('gsub').innerHTML='<option value="">-- المادة --</option>'+suo;
  document.getElementById('rs').innerHTML='<option value="">-- طالب --</option>'+DB.students.map(x=>`<option value="${x.id}">${x.name} (${x.section})</option>`).join('');
  document.getElementById('sl').innerHTML=DB.sections.map(x=>`<div class="li"><div><b>${x}</b></div><button class="ib" onclick="delS('${x}')">🗑️</button></div>`).join('');
  document.getElementById('subl').innerHTML=DB.subjects.map(x=>`<div class="li"><div><b>${x.name}</b></div><button class="ib" onclick="delSub(${x.id})">🗑️</button></div>`).join('');
}

function renderGt(){
  let s=document.getElementById('gs').value,sid=+document.getElementById('gsub').value,c=document.getElementById('gt'),b=document.getElementById('sg');
  if(!s||!sid){c.innerHTML='';b.style.display='none';return;}
  let st=DB.students.filter(x=>x.section===s);
  if(!st.length){c.innerHTML='<p style="text-align:center;">لا يوجد طلاب</p>';b.style.display='none';return;}
  let h='<table><thead><tr><th>الطالب</th><th>ش1 ش</th><th>ش1 ت</th><th>ش2 ش</th><th>ش2 ت</th><th>نصف</th><th>ش3 ش</th><th>ش3 ت</th><th>ش4 ش</th><th>ش4 ت</th><th>نهائي</th></tr></thead><tbody>';
  st.forEach(x=>{
    let g=DB.grades.find(y=>y.student_id===x.id&&y.subject_id===sid)||{};
    let v=k=>g[k]!==undefined?g[k]:'';
    h+=`<tr><td style="text-align:right;font-weight:bold;">${x.name}</td>
    <td><input type="number" id="a1-${x.id}" value="${v('m1_o')}" style="width:40px;padding:4px;margin:0;"></td>
    <td><input type="number" id="a2-${x.id}" value="${v('m1_w')}" style="width:40px;padding:4px;margin:0;"></td>
    <td><input type="number" id="a3-${x.id}" value="${v('m2_o')}" style="width:40px;padding:4px;margin:0;"></td>
    <td><input type="number" id="a4-${x.id}" value="${v('m2_w')}" style="width:40px;padding:4px;margin:0;"></td>
    <td><input type="number" id="a5-${x.id}" value="${v('mid')}" style="width:40px;padding:4px;margin:0;"></td>
    <td><input type="number" id="a6-${x.id}" value="${v('m3_o')}" style="width:40px;padding:4px;margin:0;"></td>
    <td><input type="number" id="a7-${x.id}" value="${v('m3_w')}" style="width:40px;padding:4px;margin:0;"></td>
    <td><input type="number" id="a8-${x.id}" value="${v('m4_o')}" style="width:40px;padding:4px;margin:0;"></td>
    <td><input type="number" id="a9-${x.id}" value="${v('m4_w')}" style="width:40px;padding:4px;margin:0;"></td>
    <td><input type="number" id="a10-${x.id}" value="${v('final')}" style="width:40px;padding:4px;margin:0;"></td></tr>`;
  });
  c.innerHTML=h+'</tbody></table>';b.style.display='block';
}

function saveG(){
  let s=document.getElementById('gs').value,sid=+document.getElementById('gsub').value;
  DB.students.filter(x=>x.section===s).forEach(x=>{
    let gv=id=>document.getElementById(id)?.value?+document.getElementById(id).value:null;
    let d={m1_o:gv(`a1-${x.id}`),m1_w:gv(`a2-${x.id}`),m2_o:gv(`a3-${x.id}`),m2_w:gv(`a4-${x.id}`),mid:gv(`a5-${x.id}`),m3_o:gv(`a6-${x.id}`),m3_w:gv(`a7-${x.id}`),m4_o:gv(`a8-${x.id}`),m4_w:gv(`a9-${x.id}`),final:gv(`a10-${x.id}`)};
    let ex=DB.grades.find(y=>y.student_id===x.id&&y.subject_id===sid);
    if(ex)Object.assign(ex,d);else DB.grades.push({id:nid(DB.grades),student_id:x.id,subject_id:sid,...d});
  });sv();tst('تم الحفظ ✅');
}

function renderAtt(){
  let s=document.getElementById('as').value,d=document.getElementById('ad').value;
  if(!s||!d)return;let k=s+'_'+d;if(!DB.attendance[k])DB.attendance[k]={};
  document.getElementById('al').innerHTML=DB.students.filter(x=>x.section===s).map(x=>`<div class="li"><div><b>${x.name}</b></div><label style="display:flex;align-items:center;gap:5px;"><input type="checkbox" style="width:20px;margin:0;" ${DB.attendance[k][x.id]?'checked':''} onchange="DB.attendance['${k}'][${x.id}]=this.checked;sv();"><span style="font-size:13px;color:red;">غائب</span></label></div>`).join('');
}

function renderAct(){
  let s=document.getElementById('acs').value;if(!s)return;
  document.getElementById('acl').innerHTML=DB.students.filter(x=>x.section===s).map(x=>`<div class="li"><div><b>${x.name}</b></div><input type="number" id="ac-${x.id}" value="${DB.activity[x.id]||''}" style="width:80px;margin:0;padding:8px;text-align:center;"></div>`).join('');
  document.getElementById('sa').style.display='block';
}
function saveAct(){
  let s=document.getElementById('acs').value;
  DB.students.filter(x=>x.section===s).forEach(x=>{let v=document.getElementById(`ac-${x.id}`).value;if(v)DB.activity[x.id]=+v;else delete DB.activity[x.id];});sv();tst('تم الحفظ ✅');
}

function calcAbsences(sid){
  let count=0;
  for(let k in DB.attendance){
    if(DB.attendance[k][sid]) count++;
  }
  return count;
}

function genRep(box,forceId=null){
  let sid=forceId||+document.getElementById('rs').value;if(!sid)return;
  let st=DB.students.find(x=>x.id===sid),gs=DB.grades.filter(x=>x.student_id===sid);
  let absences=calcAbsences(sid), activity=DB.activity[sid]||0;
  
  let h=`<div style="border:1px solid #cbd5e1;padding:15px;background:#fff;border-radius:8px;overflow-x:auto;">
    <h3 style="text-align:center;margin-bottom:15px;color:var(--d);">كشف درجات الطالب</h3>
    <div style="margin-bottom:15px;border-bottom:1px solid #eee;padding-bottom:10px;">
