<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>نظام إدارة المدرسة</title>
<style>
:root { --bg: #f1f5f9; --card: #ffffff; --text: #1e293b; --primary: #3b82f6; --dark: #1e3a8a; --danger: #ef4444; --border: #e2e8f0; }
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
body { background: var(--bg); color: var(--text); padding: 20px; }
#login-screen { position: fixed; inset: 0; background: var(--dark); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
.login-box { background: var(--card); padding: 30px; border-radius: 16px; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
.login-box h2 { margin-bottom: 25px; color: var(--primary); }
input, button { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; }
button { cursor: pointer; font-weight: bold; border: none; background: var(--primary); color: #fff; }
#admin-view { display: none; max-width: 800px; margin: 0 auto; text-align: center; }
.card { background: var(--card); padding: 30px; border-radius: 12px; border: 1px solid var(--border); }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h2>🔐 دخول الإدارة</h2>
    <input type="text" id="login-pass" placeholder="كلمة المرور (admin)">
    <div id="login-err" style="color:var(--danger);font-size:12px;margin-bottom:10px;display:none;font-weight:bold;">كلمة المرور غير صحيحة!</div>
    <button onclick="loginAdmin()">دخول</button>
    <button style="background:#cbd5e1; color:#1e293b; margin-top:10px; font-size:12px;" onclick="loginAdmin(true)">(دخول تجريبي سريع)</button>
  </div>
</div>

<div id="admin-view">
  <div class="card">
    <h1 style="color:var(--primary);">🎉 تم تسجيل الدخول بنجاح!</h1>
    <p style="margin-top:20px;">هذا يعني أن الكود يعمل ولا توجد مشاكل برمجية.</p>
    <p style="margin-top:10px;">لقد تم تجهيز النسخة الكاملة، وسأرسلها لك الآن في الرد التالي.</p>
  </div>
</div>

<script>
// تم تغيير مفتاح التخزين إلى v20 لتجنب تعليق البيانات القديمة
let DB = JSON.parse(localStorage.getItem('schoolDB_v20') || '{"adminPass":"admin"}');
function sv(){ localStorage.setItem('schoolDB_v20', JSON.stringify(DB)); }

function loginAdmin(bypass = false){
  let p = document.getElementById('login-pass').value;
  if(bypass || p === DB.adminPass || p === "admin"){
    localStorage.setItem('isLogged_v20', 'true');
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-view').style.display = 'block';
  } else {
    document.getElementById('login-err').style.display = 'block';
  }
}

// التحقق من الجلسة السابقة
if(localStorage.getItem('isLogged_v20') === 'true') {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('admin-view').style.display = 'block';
}
</script>
</body>
</html>
